site_name: orbit
site_description: TUI to launch, control and monitor local services respecting their dependencies
site_url: https://jgoterris.github.io/orbit/
repo_url: https://github.com/JGoterris/orbit
repo_name: JGoterris/orbit
edit_uri: edit/main/docs/

exclude_docs: |
  requirements.txt

nav:
  - Home: README.md
  - Features: features.md
  - Usage: usage.md
  - Keys: keys.md
  - Configuration: configuration.md
  - Git: git.md
  - Themes: themes.md
  - Scripting & editors: scripting.md
  - AI agents: agents.md
  - Platforms: platforms.md
  - Upgrading from 0.x: upgrading.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle: { icon: material/brightness-4, name: Light mode }
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
