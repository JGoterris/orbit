# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: orbit

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: orbit
    main: ./cmd/orbit
    binary: orbit
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: orbit
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "orbit_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - orbit.schema.json
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^chore"
      - "^docs"

release:
  draft: true
  # a tag with a suffix (v0.8.0-beta.1) is marked as a pre-release
  prerelease: auto
