name: Release

# Pushing a tag vX.Y.Z runs the CI on the tagged commit, builds every platform, publishes a GitHub release
# (binaries, .deb, .rpm, checksums, build provenance) and, for a final release, updates the Homebrew tap and the
# Cloudsmith apt / rpm repository, and the website is rebuilt to show the docs of the new version.
# A tag with a suffix (v0.8.0-beta.1, v1.0.0-rc.1) is a pre-release: GitHub marks it so and neither the tap nor
# Cloudsmith is touched.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # build provenance attestations
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
      - name: Publish the .deb and .rpm to Cloudsmith
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CLOUDSMITH_REPO: ${{ vars.CLOUDSMITH_REPO }}
        run: |
          pip install --quiet cloudsmith-cli==1.29.0
          for f in dist/*.deb; do cloudsmith push deb "$CLOUDSMITH_REPO/any-distro/any-version" "$f" --republish; done
          for f in dist/*.rpm; do cloudsmith push rpm "$CLOUDSMITH_REPO/any-distro/any-version" "$f" --republish; done

  site:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - run: gh api repos/JGoterris/orbit-site/dispatches -f event_type=orbit-released
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
