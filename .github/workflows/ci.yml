name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: IPC trace (Windows diagnosis, temporary)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          ORBIT_IPC_DEBUG: "1"
        run: bun test test/ipc.test.ts -t "history" 2>&1 | tail -80
      - run: bun test
