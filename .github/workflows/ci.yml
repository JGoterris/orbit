name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Named pipe repro (Windows diagnosis, temporary)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: bun scripts/pipe-repro.ts
      - name: Real IPC classes repro (Windows diagnosis, temporary)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: bun scripts/ipc-repro.ts
      - name: bun test repro variants (Windows diagnosis, temporary)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          ORBIT_REPRO: "1"
        run: |
          for t in T1 T2 T3 T4 T5 T6; do
            echo "=== $t"
            bun test test/zz-ipc-repro.test.ts -t "repro $t " 2>&1 | grep -E "\(pass\)|\(fail\)|Received message|timed out|^ *[0-9]+ (pass|fail)" || true
          done
      - name: IPC trace (Windows diagnosis, temporary)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          ORBIT_IPC_DEBUG: "1"
        run: |
          bun test test/ipc.test.ts -t "history: buckets" 2>&1 | head -120
      - run: bun test
