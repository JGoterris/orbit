name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  # the release workflow runs the same checks on the tagged commit before building
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: go mod tidy
        if: runner.os == 'Linux'
        run: go mod tidy -diff
      - run: go vet ./...
      - name: staticcheck
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: go test (race detector)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: go test
        if: runner.os != 'Linux'
        run: go test ./...
      - run: go build ./cmd/orbit
