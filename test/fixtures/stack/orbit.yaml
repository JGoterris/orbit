# Fixture stack for test/ui.test.tsx.
name: demo
env:
  LOG_LEVEL: info

services:
  # postgres comes from docker-compose.yml

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    cmd: redis-server --save "" --appendonly no
    description: cache & queues

  auth:
    cmd: bun services/http.ts auth
    port: 4300
    env: { PORT: "4300" }
    depends_on: [postgres]
    health: http://localhost:4300/health

  api:
    cmd: bun --watch services/http.ts api
    port: 4100
    env:
      PORT: "4100"
      DATABASE_URL: "postgres://postgres:orbit@localhost:55432/demo"
      # long values, to try how the env overlay (e) wraps them
      ALLOWED_ORIGINS: "http://localhost:4200,http://localhost:4400,https://demo.example.com,https://admin.demo.example.com,https://staging.demo.example.com,https://preview-1234.demo.example.com"
      FEATURE_FLAGS: "new-dashboard=on,beta-search=off,audit-log=on,rate-limit-v2=on,dark-mode-default=off,export-csv=on,webhooks-retry=on"
      JWT_PUBLIC_KEY: "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAu1SU1LfVLPHCozMxH2Mo4lgOEePzNm0tRgeLezV6ffAt0gunVTLw7onLRnrq0"
    depends_on: [postgres, redis, auth]
    health: { http: "http://localhost:4100/health", interval: 2s }
    restart: on-failure

  worker:
    cmd: bun services/worker.ts
    depends_on: [redis, postgres]
    restart: on-failure
    description: crashes now and then to show restarts

  web:
    cmd: bun services/http.ts web
    port: 4200
    env: { PORT: "4200" }
    depends_on: [api]
    health: http://localhost:4200/

  admin:
    cmd: bun services/http.ts admin
    port: 4400
    env: { PORT: "4400" }
    depends_on: [api, auth]

  docs:
    cmd: bun services/http.ts docs
    port: 4500
    env: { PORT: "4500" }
    autostart: false

groups:
  backend: [postgres, redis, auth, api, worker]
  frontend: [web, admin]
