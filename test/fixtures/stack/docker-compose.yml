# Imported automatically by orbit (depends_on + healthcheck are honoured)
name: orbit-demo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: demo
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
