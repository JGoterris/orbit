name: demo
version: 0.1.0
api: 1
description: Touches every extension point of orbit; the plugin the tests run
run: { command: [./demo, serve], windows: [./demo.exe, serve] }
cli: { command: [./demo], windows: [./demo.exe] }
events: [state]
contributes:
  views:
    - id: items
      title: Items
      panes:
        - { id: list, widget: list, title: Items, weight: 2 }
        - { id: info, widget: detail, title: Info, bind: list }
        - { id: log, widget: text, title: Log, bind: list }
  actions:
    - id: bump
      title: Bump
      key: B
      scope: { view: items, pane: list }
      confirm: { title: "Bump {item} ({level})?" }
      inputs:
        - { name: level, kind: pick, options: [minor, major] }
    - id: hello
      title: Say hello
      key: alt+h
  serviceSections:
    - { id: info, title: Demo }
  serviceColumn: { id: tag, width: 8 }
  headerBadges: true
  serviceTypes:
    - { name: ticker, badge: tick }
